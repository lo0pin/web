<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Code</title>

  <link rel="stylesheet" href="../assets/css/main.css" />
</head>

<body>
  <header class="site-header">
    <div class="header-inner">

      <h1 class="site-title">Code</h1>
      <nav class="top-nav" aria-label="Top navigation">

        <a href="../index.html">home</a>
      </nav>
    </div>
  </header>

  <main class="content">
    <hr class="divider" />
    <section class="hero" aria-label="Essence">
      <p class="hero-quote">
        "Readable code, honest mistakes, continuous learning"
      </p>
    </section>

    <hr class="divider" />


    <section class="tile-section" aria-label="Sections">
      <div class="tile-grid">
        <a class="tile" href="" aria-label="HTML / CSS / JavaScript">
          <img class="tile-image" src="../assets/img/coding_html.png" alt="" />
          <span class="tile-label">🌊 HTML / CSS / JavaScript</span>
        </a>

        <a class="tile" href="" aria-label="Python">
          <img class="tile-image" src="../assets/img/coding_cpp.png" alt="" />
          <span class="tile-label">💻 Python</span>
        </a>

        <a class="tile" href="" aria-label="C++">
          <img class="tile-image" src="../assets/img/coding_python.png" alt="" />
          <span class="tile-label">⚡ C++</span>
        </a>

        <a class="tile" href="" aria-label="Data & Visualization / Algorithms & Thinking">
          <img class="tile-image" src="../assets/img/coding_data_vis.png" alt="" />
          <span class="tile-label">⚡ Data & Visualization / Algorithms & Thinking</span>
        </a>
        <!-- Data & Visualization (auch für Messprojekte), Algorithms & Thinking (nicht nur Code, sondern Denkweise)-->
        
        <a class="tile" href="" aria-label="Homebrew Browsergames">
          <img class="tile-image" src="../assets/img/coding_homebrew.png" alt="" />
          <span class="tile-label">🎮 Homebrew Browsergames</span>
        </a>


        
      </div>
    </section>
  </main>

  <!--
    FOOTER = unterer Seitenbereich.
    Typisch für:
    - Copyright
    - ggf. kleine Links (Impressum/Privacy), wenn du das später brauchst
  -->
  <footer class="site-footer">
    <p>© 2025 Julian</p>
  </footer>

  <!--
    JavaScript einbinden:
    - defer bedeutet: Script wird geladen, aber erst ausgeführt,
      nachdem das HTML geparst wurde.
    Vorteil: Das Script blockiert nicht das Rendering der Seite.
  -->
  <script src="../assets/js/main.js" defer></script>
</body>
</html>
