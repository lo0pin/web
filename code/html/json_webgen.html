<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Website JSON Beitrag Generator</title>
  <style>
    :root{
      --bg:#0f1115; --panel:#141824; --surface:#161b2a;
      --text:#e9eef7; --muted:#aab4c5; --border:#2a3244;
      --ok:#34d399; --bad:#f87171; --focus:#7dd3fc;
      --radius:14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
      line-height:1.35;
    }
    .wrap{
      max-width:1200px; margin:0 auto; padding:18px;
    }
    h1{font-size:1.15rem; margin:0 0 14px; color:var(--text); font-weight:700}
    .grid{
      display:grid; gap:14px;
      grid-template-columns: 1.3fr 0.9fr;
    }
    @media (max-width: 980px){
      .grid{grid-template-columns:1fr}
    }
    .card{
      background:linear-gradient(180deg, var(--panel), var(--surface));
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px;
      box-shadow: 0 8px 28px rgba(0,0,0,.25);
    }
    .row{
      display:grid; grid-template-columns: 170px 1fr; gap:10px;
      align-items:start;
      margin:10px 0;
    }
    label{color:var(--muted); font-size:.92rem; padding-top:7px}
    input, select, textarea{
      width:100%;
      background:#0f1320;
      border:1px solid var(--border);
      color:var(--text);
      border-radius:12px;
      padding:10px 12px;
      outline:none;
      font-size:.98rem;
    }
    textarea{min-height:220px; resize:vertical; font-family:var(--sans)}
    input[readonly]{opacity:.9}
    input:focus, select:focus, textarea:focus{
      border-color:var(--focus);
      box-shadow:0 0 0 3px rgba(125,211,252,.15);
    }
    .inline{
      display:flex; gap:10px; align-items:center;
    }
    .btn{
      appearance:none;
      border:1px solid var(--border);
      background:#0e1220;
      color:var(--text);
      padding:9px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:600;
      font-size:.92rem;
      user-select:none;
    }
    .btn:hover{border-color:#3b4762}
    .btn:active{transform:translateY(1px)}
    .btn.primary{
      background:#101a2a;
      border-color:#415070;
    }
    .btn.small{padding:7px 10px; font-weight:600; font-size:.9rem}
    .hint{color:var(--muted); font-size:.9rem; margin-top:4px}
    .toolbar{display:flex; flex-wrap:wrap; gap:8px}
    .images{
      border:1px dashed #36405a;
      border-radius:12px;
      padding:10px;
      background:#0f1320;
    }
    .imglist{
      margin:10px 0 0;
      list-style:none; padding:0; margin-left:0;
      max-height:140px; overflow:auto;
      border:1px solid var(--border);
      border-radius:12px;
    }
    .imglist li{
      display:flex; justify-content:space-between; gap:10px;
      padding:8px 10px; border-bottom:1px solid rgba(42,50,68,.7);
      font-family:var(--mono); font-size:.9rem;
    }
    .imglist li:last-child{border-bottom:none}
    .imglist button{
      border:1px solid var(--border);
      background:transparent;
      color:var(--muted);
      border-radius:10px;
      padding:4px 8px;
      cursor:pointer;
    }
    .imglist button:hover{color:var(--text); border-color:#3b4762}
    pre, .mono{font-family:var(--mono)}
    #output{
      min-height:520px;
      font-family:var(--mono);
      white-space:pre;
    }
    .status{
      margin-left:10px;
      font-size:.92rem;
      color:var(--muted);
    }
    .status.ok{color:var(--ok)}
    .status.bad{color:var(--bad)}
  </style>
</head>

<body>
<div class="wrap">
  <h1>Website JSON Beitrag Generator (Browser)</h1>

  <div class="grid">
    <!-- LEFT -->
    <section class="card">
      <div class="row">
        <label for="id">id (auto)</label>
        <input id="id" type="text" readonly />
      </div>

      <div class="row">
        <label for="topic">topic</label>
        <select id="topic"></select>
      </div>

      <div class="row">
        <label for="subtopic">subtopic</label>
        <select id="subtopic"></select>
      </div>

      <div class="row">
        <label for="date">date</label>
        <div class="inline">
          <input id="date" type="text" placeholder="YYYY-MM-DD" />
          <button class="btn small" id="today">heute</button>
        </div>
      </div>

      <div class="row">
        <label for="title">title</label>
        <input id="title" type="text" />
      </div>

      <div class="row">
        <label for="format">format</label>
        <select id="format">
          <option value="markdown" selected>markdown</option>
          <option value="html">html</option>
          <option value="text">text</option>
        </select>
      </div>

      <div class="row">
        <label for="content">content</label>
        <div>
          <div class="toolbar" style="margin-bottom:8px">
            <button class="btn small" data-wrap="**">**fett**</button>
            <button class="btn small" data-wrap="*">*kursiv*</button>
            <button class="btn small" data-wrap="~">~Zitat~</button>
            <button class="btn small" id="mklist">Liste (-)</button>
            <button class="btn small" id="blank">Leerzeile</button>
          </div>
          <textarea id="content" spellcheck="false"></textarea>
        </div>
      </div>

      <div class="row">
        <label>images</label>
        <div class="images">
          <div class="hint">Pfad-Prefix ist fix: <span class="mono">../assets/img/</span>…</div>

          <div class="row" style="grid-template-columns: 110px 1fr; margin:10px 0 0">
            <label for="imgFile" style="padding-top:6px">Dateiname</label>
            <input id="imgFile" type="text" placeholder="example.jpg" />
          </div>

          <div class="row" style="grid-template-columns: 110px 1fr; margin:10px 0 0">
            <label for="imgAlt" style="padding-top:6px">alt</label>
            <input id="imgAlt" type="text" placeholder="image" />
          </div>

          <div style="display:flex; gap:10px; align-items:center; margin-top:10px">
            <button class="btn small" id="addImg">Add</button>
            <div class="hint" style="margin:0">Einträge erscheinen unten; einzeln entfernbar.</div>
          </div>

          <ul class="imglist" id="imgList"></ul>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:10px; margin-top:14px">
        <button class="btn primary" id="generate">Generate</button>
        <span id="status" class="status"></span>
      </div>
    </section>

    <!-- RIGHT -->
    <section class="card">
      <div class="hint" style="margin:0 0 8px">
        Output (click to copy). JSON escapt sauber: <span class="mono">\n</span>, <span class="mono">\"</span> usw.
      </div>
      <textarea id="output" readonly></textarea>
      <div class="hint" style="margin-top:10px">
        Kleine Gemeinheit der Physik: die Zeit in der ID wird beim <span class="mono">Generate</span> aktualisiert.
      </div>
    </section>
  </div>
</div>

<script>
  const ASSET_PREFIX = "../assets/img/";

  const TOPICS = {
    "": [""],
    "botanik": ["", "raspberry", "ribisl", "fig"],
    "making": ["", "3dprint"],
    "code": ["", "html", "python", "cpp"],
    "words": ["", "communication", "history", "linguistics", "literature", "philosophy", "poetry"],
    "electronics": ["", "mesh"],
  };

  const el = (id) => document.getElementById(id);

  const state = {
    images: [] // {src, alt}
  };

  function sanitizeToken(s){
    s = (s ?? "").trim().replaceAll(" ", "_");
    while (s.includes("__")) s = s.replaceAll("__","_");
    return s.replace(/^_+|_+$/g, "");
  }

  function hhmm(){
    const d = new Date();
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    return `${hh}_${mm}`;
  }

  function updateId(){
    const d = sanitizeToken(el("date").value);
    const t = sanitizeToken(el("topic").value);
    const s = sanitizeToken(el("subtopic").value);
    const time = hhmm();

    const parts = [d,t,s,time].filter(p => p && p.length);
    el("id").value = parts.length ? parts.join("_") : time;
  }

  function setStatus(msg, kind="ok"){
    const st = el("status");
    st.textContent = msg || "";
    st.classList.remove("ok","bad");
    if (msg){
      st.classList.add(kind === "bad" ? "bad" : "ok");
      window.clearTimeout(setStatus._t);
      setStatus._t = window.setTimeout(() => setStatus("", "ok"), 1600);
    }
  }

  function populateTopics(){
    const t = el("topic");
    t.innerHTML = "";
    Object.keys(TOPICS).forEach(k=>{
      const opt = document.createElement("option");
      opt.value = k;
      opt.textContent = k === "" ? "(leer)" : k;
      t.appendChild(opt);
    });
  }

  function populateSubtopics(topic){
    const s = el("subtopic");
    const allowed = TOPICS[topic] ?? [""];
    const current = s.value;

    s.innerHTML = "";
    allowed.forEach(k=>{
      const opt = document.createElement("option");
      opt.value = k;
      opt.textContent = k === "" ? "(leer)" : k;
      s.appendChild(opt);
    });

    // keep selection if still allowed, else reset to ""
    if (allowed.includes(current)) s.value = current;
    else s.value = "";

    updateId();
  }

  function wrapSelection(textarea, wrap){
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;

    if (start === end){
      // no selection: insert wrapwrap and place cursor inside
      const insert = wrap + wrap;
      textarea.setRangeText(insert, start, end, "end");
      const pos = start + wrap.length;
      textarea.setSelectionRange(pos, pos);
      textarea.focus();
      return;
    }

    const selected = textarea.value.slice(start, end);
    textarea.setRangeText(wrap + selected + wrap, start, end, "end");
    textarea.focus();
  }

  function makeList(textarea){
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;

    if (start === end){
      textarea.setRangeText("- ", start, end, "end");
      textarea.focus();
      return;
    }

    // Expand to full lines
    const v = textarea.value;
    const lineStart = v.lastIndexOf("\n", start - 1) + 1;
    const lineEnd = v.indexOf("\n", end);
    const realEnd = lineEnd === -1 ? v.length : lineEnd;

    const block = v.slice(lineStart, realEnd);
    const lines = block.split("\n").map(line=>{
      if (line.trim() === "") return line;
      return line.startsWith("- ") ? line : "- " + line;
    }).join("\n");

    textarea.setRangeText(lines, lineStart, realEnd, "end");
    textarea.focus();
  }

  function addImage(){
    const file = el("imgFile").value.trim();
    const alt = (el("imgAlt").value.trim() || "image");

    if (!file){
      setStatus("Kein Dateiname.", "bad");
      return;
    }
    state.images.push({ src: ASSET_PREFIX + file, alt });
    el("imgFile").value = "";
    renderImages();
  }

  function removeImage(idx){
    state.images.splice(idx, 1);
    renderImages();
  }

  function renderImages(){
    const ul = el("imgList");
    ul.innerHTML = "";
    state.images.forEach((img, idx)=>{
      const li = document.createElement("li");
      const left = document.createElement("span");
      left.textContent = `${img.src} | ${img.alt}`;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "Remove";
      btn.addEventListener("click", ()=>removeImage(idx));
      li.appendChild(left);
      li.appendChild(btn);
      ul.appendChild(li);
    });
  }

  function generate(){
    updateId(); // refresh time-part

    const post = {
      id: el("id").value,
      topic: el("topic").value,
      subtopic: el("subtopic").value,
      date: el("date").value.trim(),
      title: el("title").value.trim(),
      format: el("format").value.trim(),
      content: el("content").value,
      images: state.images.slice()
    };

    el("output").value = JSON.stringify(post, null, 2);
    setStatus("Generiert. Klick ins Output-Feld kopiert.", "ok");
  }

  async function copyOutput(){
    const text = el("output").value.trim();
    if (!text) return;
    try{
      await navigator.clipboard.writeText(text);
      setStatus("In Zwischenablage kopiert.", "ok");
    }catch(err){
      // Fallback for stricter browsers
      el("output").focus();
      el("output").select();
      document.execCommand("copy");
      setStatus("In Zwischenablage kopiert.", "ok");
    }
  }

  // ----- init -----
  populateTopics();
  populateSubtopics(el("topic").value);
  updateId();

  // topic/subtopic changes
  el("topic").addEventListener("change", (e)=>populateSubtopics(e.target.value));
  el("subtopic").addEventListener("change", updateId);

  // date changes
  el("date").addEventListener("input", updateId);

  // today button
  el("today").addEventListener("click", ()=>{
    const d = new Date();
    const iso = d.toISOString().slice(0,10); // YYYY-MM-DD
    el("date").value = iso;
    updateId();
  });

  // content toolbar
  document.querySelectorAll("[data-wrap]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      wrapSelection(el("content"), btn.getAttribute("data-wrap"));
    });
  });
  el("mklist").addEventListener("click", ()=>makeList(el("content")));
  el("blank").addEventListener("click", ()=>{
    const ta = el("content");
    const pos = ta.selectionStart;
    ta.setRangeText("\n\n", pos, ta.selectionEnd, "end");
    ta.focus();
  });

  // images
  el("addImg").addEventListener("click", addImage);

  // generate
  el("generate").addEventListener("click", generate);

  // click output copies
  el("output").addEventListener("click", copyOutput);
  el("output").addEventListener("focus", copyOutput);
</script>
</body>
</html>
