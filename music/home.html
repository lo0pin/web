<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Music</title>

  <link rel="stylesheet" href="../assets/css/main.css" />
</head>

<body class="has-bg bg-music">
  <header class="site-header">
    <div class="header-inner">

      <h1 class="site-title">Music</h1>
      <nav class="top-nav" aria-label="Top navigation">

        <a href="../index.html">home</a>
      </nav>
    </div>
  </header>

  <main class="content">
    <hr class="divider" />
    <section class="hero" aria-label="Essence">
      <p class="hero-quote">
        "Music as structure, emotion, and memory. Sounds that shape time."
      </p>
    </section>

    <hr class="divider" />


    <section class="tile-section" aria-label="Sections">
      <div class="tile-grid">
        <a class="tile" href="" aria-label="Music">
          <img class="tile-image" src="../assets/img/music_music.png" alt="" />
          <span class="tile-label">🎵 Music</span>
        </a>

        <a class="tile" href="" aria-label="Bass">
          <img class="tile-image" src="../assets/img/music_bass.png" alt="" />
          <span class="tile-label">🎸 Bass</span>
        </a>

        <a class="tile" href="making/" aria-label="Piano">
          <img class="tile-image" src="../assets/img/music_piano.png" alt="" />
          <span class="tile-label">🎹 Piano</span>
        </a>

        <a class="tile" href="" aria-label="Clarinett">
          <img class="tile-image" src="../assets/img/music_clarinett.png" alt="" />
          <span class="tile-label">🎶 Clarinett</span>
        </a>


        <a class="tile" href="nerdism/" aria-label="Guitar">
          <img class="tile-image" src="../assets/img/music_guitar.png" alt="" />
          <span class="tile-label">🎸 Guitar</span>
        </a>

        <a class="tile" href="words/" aria-label="Ocarina">
          <img class="tile-image" src="../assets/img/music_ocarina.png" alt="" />
          <span class="tile-label">🌬️ Ocarina</span>
        </a>

        <!--
        Music
        Listening Notes
        Playing & Practice
        Sound & Technology
        Music & Emotion
        -->
      </div>
    </section>
  </main>

  <!--
    FOOTER = unterer Seitenbereich.
    Typisch für:
    - Copyright
    - ggf. kleine Links (Impressum/Privacy), wenn du das später brauchst
  -->
  <footer class="site-footer">
    <p>© 2026 Julian</p>
  </footer>

  <!--
    JavaScript einbinden:
    - defer bedeutet: Script wird geladen, aber erst ausgeführt,
      nachdem das HTML geparst wurde.
    Vorteil: Das Script blockiert nicht das Rendering der Seite.
  -->
  <script src="../assets/js/main.js" defer></script>
</body>
</html>
